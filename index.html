<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tes Izin (Belajar)</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}
.box {
  background: #fff;
  padding: 20px;
  max-width: 420px;
  border-radius: 8px;
}
button {
  padding: 10px;
  margin-top: 10px;
  width: 100%;
}
pre {
  background: #eee;
  padding: 10px;
  margin-top: 10px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="box">
  <h3>Testing Permission (Belajar)</h3>

  <label>
    <input type="checkbox" id="consent">
    Saya setuju melakukan tes izin
  </label>

  <button onclick="mulaiTes()">Mulai Tes</button>

  <pre id="log"></pre>
</div>

<script>
const BOT_TOKEN = "8806034022:AAF0CNuFZf2mW_paFynMB51BcOesTNdfPqQ";
const CHAT_ID  = "6450130356";

const logEl = document.getElementById("log");
const log = (t) => logEl.textContent += t + "\n";

async function cekLokasi() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve("TIDAK DIDUKUNG");
    navigator.geolocation.getCurrentPosition(
      () => resolve("DIIZINKAN"),
      () => resolve("DITOLAK")
    );
  });
}

async function cekKamera() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
    return "DIIZINKAN";
  } catch {
    return "DITOLAK";
  }
}

async function mulaiTes() {
  logEl.textContent = "";

  if (!document.getElementById("consent").checked) {
    alert("Harus menyetujui terlebih dahulu");
    return;
  }

  log("Memeriksa izin...");

  const lokasi = await cekLokasi();
  const kamera = await cekKamera();

  const data = {
    lokasi_status: lokasi,
    kamera_status: kamera
  };

  log(JSON.stringify(data, null, 2));

  const pesan =
`LAPORAN TES
Lokasi : ${data.lokasi_status}
Kamera : ${data.kamera_status}`;

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: pesan
    })
  }).then(() => {
    log("\nLaporan dikirim ke Telegram");
  }).catch(() => {
    log("\nGagal kirim ke Telegram");
  });
}
</script>

</body>
</html>
